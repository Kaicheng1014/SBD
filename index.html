<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PROJECT : 1222</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0a0d14;
      --grid-line: rgba(56, 189, 248, 0.04);
      --card: rgba(17, 23, 36, 0.92);
      --card-border: rgba(56, 189, 248, 0.22);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.35);
      --primary-dark: #0284c7;
      --amber: #f59e0b;
      --emerald: #10b981;
      --danger: #f43f5e;
      --text: #e2e8f0;
      --sub: #94a3b8;
      --dossier-bg: rgba(10, 14, 23, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px 20px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 24px rgba(56, 189, 248, 0.08);
      backdrop-filter: blur(12px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* 頂部機密系統狀態列 */
    .sys-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "SF Mono", "Fira Code", Menlo, Consolas, monospace;
      font-size: 11px;
      color: var(--sub);
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      padding-bottom: 12px;
      margin-bottom: 18px;
      letter-spacing: 0.8px;
    }

    .sys-id {
      color: var(--primary);
      font-weight: 700;
    }

    .sys-status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--emerald);
      font-size: 10.5px;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: var(--emerald);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--emerald);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .stage {
      display: none;
      animation: fadeIn 0.35s ease forwards;
    }

    .stage.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .step-badge {
      display: inline-block;
      font-family: "SF Mono", "Fira Code", Menlo, Consolas, monospace;
      background: rgba(56, 189, 248, 0.12);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 6px;
      margin-bottom: 14px;
      letter-spacing: 0.8px;
    }

    h1 {
      font-size: 20px;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: #f8fafc;
    }

    .subtitle {
      font-size: 13.5px;
      color: var(--sub);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    /* 4組數字密碼鎖槽 */
    .collected-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .code-slot {
      flex: 1;
      padding: 9px 4px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 8px;
      font-family: "SF Mono", "Fira Code", Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      border: 1px solid rgba(148, 163, 184, 0.2);
      transition: all 0.3s ease;
    }

    .code-slot.unlocked {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.45);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.15);
    }

    /* 機密檔案情報框 */
    .dossier-box {
      background: var(--dossier-bg);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-left: 3px solid var(--primary);
      border-radius: 10px;
      padding: 16px 15px;
      margin-bottom: 20px;
      text-align: left;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.4);
    }

    .dossier-header {
      font-family: "SF Mono", "Fira Code", Menlo, Consolas, monospace;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--amber);
      margin-bottom: 10px;
      letter-spacing: 0.6px;
    }

    .dossier-text {
      font-size: 14.5px;
      line-height: 1.75;
      color: #cbd5e1;
    }

    .dossier-text b {
      color: #f8fafc;
    }

    .equation-box {
      font-family: "SF Mono", "Fira Code", Menlo, Consolas, monospace;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 8px;
      padding: 10px 8px;
      margin: 12px 0;
      text-align: center;
      font-size: 15.5px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.5px;
    }

    .example-note {
      font-size: 12.5px;
      color: var(--sub);
      background: rgba(15, 23, 42, 0.65);
      padding: 8px 10px;
      border-radius: 6px;
      margin-top: 8px;
      line-height: 1.5;
    }

    input[type="text"], input[type="tel"], input[type="number"] {
      width: 100%;
      padding: 14px;
      font-family: "SF Mono", "Fira Code", Menlo, Consolas, monospace;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 5px;
      background: rgba(10, 14, 23, 0.95);
      border: 1.5px solid rgba(148, 163, 184, 0.28);
      border-radius: 10px;
      outline: none;
      margin-bottom: 14px;
      color: var(--primary);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 1px;
      color: #475569;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 14px var(--primary-glow);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: #ffffff;
      border: 1px solid rgba(125, 211, 252, 0.4);
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.35);
      transition: transform 0.1s, filter 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }

    .feedback-msg {
      color: var(--danger);
      font-size: 13.5px;
      font-weight: 500;
      margin-top: 14px;
      min-height: 20px;
      line-height: 1.55;
    }

    .feedback-msg.success {
      color: var(--emerald);
    }

    /* 累積式漸進提示列表 */
    .hint-stack {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    .hint-item {
      background: rgba(244, 63, 94, 0.08);
      border: 1px solid rgba(244, 63, 94, 0.28);
      border-left: 3px solid var(--danger);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.55;
      color: #fecdd3;
      animation: fadeIn 0.3s ease forwards;
    }

    .hint-level {
      font-family: "SF Mono", "Fira Code", Menlo, Consolas, monospace;
      font-weight: 700;
      color: #fb7185;
      margin-right: 4px;
    }

    /* 關卡 2：問答區 */
    .quiz-q {
      font-size: 16.5px;
      font-weight: 600;
      margin-bottom: 18px;
      line-height: 1.6;
      text-align: left;
      color: #f1f5f9;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      width: 100%;
      padding: 13px 15px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 10px;
      font-size: 14.5px;
      color: #cbd5e1;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      line-height: 1.45;
    }

    .option-btn:active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--primary);
      color: #ffffff;
    }

    .option-btn.bonus-opt {
      background: rgba(245, 158, 11, 0.14);
      border-color: var(--amber);
      color: #fcd34d;
      font-weight: 700;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.2);
      animation: fadeIn 0.35s ease;
    }

    /* 關卡 2 第 9 題：終極密碼範圍提示 */
    .range-badge {
      display: inline-block;
      font-family: "SF Mono", "Fira Code", Menlo, Consolas, monospace;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #fbbf24;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 頂部機密專案識別列 -->
    <div class="sys-topbar">
      <span class="sys-id">PROJECT : 1222</span>
      <span class="sys-status"><span class="pulse-dot"></span>ENCRYPTED</span>
    </div>

    <!-- ==================== 關卡 1：實體尋寶＋運算密鑰 ==================== -->
    <div id="stage-1" class="stage active">
      <div class="step-badge" id="s1-badge">PHASE 01 // FIELD RECON (1/5)</div>
      <h1 id="s1-title">現場情報搜查</h1>
      <p class="subtitle" id="s1-subtitle">目標物已啟動高階封鎖，請依序截獲四組機密數字</p>

      <!-- 4組數字收集進度 -->
      <div class="collected-bar">
        <div class="code-slot" id="slot-0">#01 [ ? ]</div>
        <div class="code-slot" id="slot-1">#02 [ ? ]</div>
        <div class="code-slot" id="slot-2">#03 [ ? ]</div>
        <div class="code-slot" id="slot-3">#04 [ ? ]</div>
      </div>

      <!-- 偵探線索框 -->
      <div class="dossier-box">
        <div class="dossier-header" id="dossier-header">【線索檔案 #01】</div>
        <div class="dossier-text" id="dossier-text"></div>
      </div>

      <input type="tel" id="s1-input" maxlength="6" placeholder="輸入截獲的機密數字">
      <button class="btn" onclick="verifyStage1()">驗證情報</button>
      <div class="feedback-msg" id="s1-feedback"></div>
      <div class="hint-stack" id="s1-hint-stack"></div>
    </div>

    <!-- ==================== 關卡 2：10 題默契快問快答 ==================== -->
    <div id="stage-2" class="stage">
      <div class="step-badge" id="quiz-progress">PHASE 02 // IDENTITY SYNC (1/10)</div>
      <div id="quiz-question" class="quiz-q"></div>
      
      <!-- 選擇題容器 -->
      <div id="quiz-options" class="options-list"></div>

      <!-- 第 9 題終極密碼專用容器 -->
      <div id="guess-box" style="display: none;">
        <div class="range-badge" id="guess-range">RANGE : 1 ～ 100 HRS</div>
        <input type="number" id="guess-input" placeholder="輸入小時數">
        <button class="btn" onclick="submitGuess()">送出數值</button>
      </div>

      <div class="feedback-msg" id="quiz-feedback"></div>
    </div>

    <!-- ==================== 關卡 3 預留過渡畫面 ==================== -->
    <div id="stage-3" class="stage">
      <div class="step-badge">PHASE 02 // VERIFIED</div>
      <h1>身份同步驗證通過</h1>

    </div>
  </div>

  <script>
    // =========================================================

    const FINAL_PROGRESSIVE_HINTS = [

    // 切換主階段
    function showStage(num) {
      document.querySelectorAll('.stage').forEach(el => el.classList.remove('active'));
      document.getElementById(`stage-${num}`).classList.add('active');
    }

    // ==================== 關卡 1 邏輯 ====================
    let s1Index = 0;
    let finalWrongCount = 0;

    function normalizeOperators(str) {
      return str
        .replace(/\s+/g, '')
        .replace(/＋/g, '+')
        .replace(/[－—–]/g, '-')
        .replace(/[＊×xX]/g, '*')
        .replace(/[／÷]/g, '/');
    }

    function renderStage1() {
      const step = STAGE1_STEPS[s1Index];
      const inputEl = document.getElementById('s1-input');
      document.getElementById('s1-badge').textContent = `PHASE 01 // FIELD RECON (${s1Index + 1}/5)`;
      document.getElementById('dossier-header').textContent = step.header;
      document.getElementById('dossier-text').innerHTML = step.text;
      inputEl.value = '';
      document.getElementById('s1-feedback').textContent = '';
      document.getElementById('s1-hint-stack').innerHTML = '';

      if (step.isFinalOperator) {
        document.getElementById('s1-title').textContent = "最終密鑰合成";
        document.getElementById('s1-subtitle').textContent = "填入三個運算符號使算式成立，解除第一道安全鎖";
        inputEl.type = "text";
        inputEl.maxLength = 8;
        inputEl.placeholder = "輸入 3 個運算符號（如 -+*）";
      } else {
        inputEl.type = "tel";
        inputEl.maxLength = 6;
        inputEl.placeholder = "輸入截獲的機密數字";
      }
    }

    function appendProgressiveHint(hintObj) {
      const stack = document.getElementById('s1-hint-stack');
      const item = document.createElement('div');
      item.className = 'hint-item';
      item.innerHTML = `<span class="hint-level">${hintObj.level}</span>${hintObj.text}`;
      stack.appendChild(item);
    }

    function verifyStage1() {
      const inputEl = document.getElementById('s1-input');
      const rawVal = inputEl.value.trim();
      const step = STAGE1_STEPS[s1Index];
      const feedback = document.getElementById('s1-feedback');

      let isMatch = false;
      if (step.isFinalOperator) {
        const userVal = normalizeOperators(rawVal);
        isMatch = step.answers.includes(userVal);
      } else {
        isMatch = (rawVal === step.answer);
      }

      if (isMatch) {
        if (s1Index < 4) {
          const slot = document.getElementById(`slot-${s1Index}`);
          slot.textContent = `#0${s1Index + 1}: ${step.answer}`;
          slot.classList.add('unlocked');
        }

        s1Index++;
        if (s1Index < STAGE1_STEPS.length) {
          renderStage1();
        } else {
          if (typeof confetti === 'function') {
            confetti({ particleCount: 60, spread: 60, origin: { y: 0.7 } });
          }
          showStage(2);
          renderQuiz();
        }
      } else {
        if (step.isFinalOperator) {
          finalWrongCount++;
          feedback.textContent = "密鑰驗證失敗，請參考下方線索提示：";
          const unlockedHint = FINAL_PROGRESSIVE_HINTS.find(h => h.threshold === finalWrongCount);
          if (unlockedHint) {
            appendProgressiveHint(unlockedHint);
          }
        } else {
          feedback.textContent = step.wrongMsg;
        }
        inputEl.value = '';
        inputEl.focus();
      }
    }

    document.getElementById('s1-input').addEventListener('keypress', e => {
      if (e.key === 'Enter') verifyStage1();
    });
